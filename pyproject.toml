[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hornlab-sim"
version = "0.1.0"
description = "Canonical lumped (LEM/TMM/Helmholtz) and LEM-BEM coupling simulators for HornLab"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "hornlab-metal-bem",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hornlab_sim*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: tests that run a real BEM solve (require OpenCL CPU runtime)",
]
