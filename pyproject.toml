[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hornlab-sim"
version = "0.1.1"
description = "Canonical lumped (LEM/TMM/Helmholtz) and LEM-BEM coupling simulators for HornLab"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "numpy",
]

[project.scripts]
hornlab-tmm = "hornlab_sim.cli.tmm:main"
hornlab-validate-hornresp = "hornlab_sim.hornresp.validate:main"

[project.optional-dependencies]
metal = ["hornlab-metal-bem @ git+https://github.com/m3gnus/hornlab-metal-bem.git"]
fem = ["scipy", "meshio"]
# `dev` pulls in `fem` because five tests in tests/test_acoustic_fem.py import
# the FEM module directly and *fail* -- they do not skip -- when SciPy is
# absent. README.md documents `pip install -e ".[dev]"` as the development
# install, so without this the documented setup produces a suite that is red on
# a clean checkout for a reason that has nothing to do with the code. A gate
# that is red out of the box teaches the reader to ignore red, which costs more
# than the two wheels.
dev = ["pytest", "hornlab-sim[fem]"]

[tool.setuptools.packages.find]
include = ["hornlab_sim*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: tests that run a real BEM solve (require OpenCL CPU runtime)",
]
